name: CI

# Red de seguridad mínima antes de mergear a dev/main: corre los tests del
# backend y el build/lint de panel y landing en cada push/PR. No despliega
# nada - el deploy sigue siendo el flujo normal de Railway (ver DEPLOY.md).
#
# IMPORTANTE: este archivo tiene que vivir en .github/workflows/ de la RAÍZ
# del repo (acá), no dentro de whatsapp-ai-agent/ - GitHub Actions solo
# descubre workflows en .github/workflows/ del root, y este proyecto vive en
# el subdirectorio whatsapp-ai-agent/ (ver working-directory de cada job).

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-ai-agent/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Sin DB_URL/DB_USERNAME/DB_PASSWORD: usa el H2 en memoria default de
      # application.properties (ver .env.example) - los tests no necesitan
      # Postgres real. jwt.secret/app.encryption-key no tienen default a
      # propósito (fail-fast en producción, ver application.properties), así
      # que acá se cargan valores dummy solo para que el contexto de Spring
      # levante en los tests.
      #
      # IMPORTANTE: ambos valores se decodifican con Base64.getDecoder()
      # (alfabeto estándar, no URL-safe) - JwtService y EncryptedStringConverter
      # fallan al arrancar si el valor no es base64 válido (ContextLoads test
      # lo detectó: "Illegal base64 character 2d", el '-' de un dummy anterior
      # tipo "ci-dummy-key-..." no es un carácter válido de base64 estándar).
      # APP_ENCRYPTION_KEY además tiene que decodificar a EXACTAMENTE 32 bytes
      # (AES-256, ver EncryptedStringConverter). Generados con: openssl rand
      # -base64 32 - no tienen ningún significado, son solo dummies válidos
      # para que el contexto de Spring levante en CI.
      - name: Run tests
        env:
          JWT_SECRET: tCefpkCiqeuTLKcREkqDo4iMDBub80ySHVNG0gQ9stU=
          APP_ENCRYPTION_KEY: q4MeHP9l9BbOLLrBASYDfHXfC1ZY2KgaW15DPoxD7Dw=
          TWILIO_ACCOUNT_SID: ACdummy
          TWILIO_AUTH_TOKEN: dummy
          TWILIO_WHATSAPP_NUMBER: "+10000000000"
          ANTHROPIC_API_KEY: sk-ant-dummy
          PANEL_USERNAME: ci-admin
          PANEL_PASSWORD: ci-dummy-password
        run: ./mvnw -B test

  panel:
    name: Panel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-ai-agent/frontend/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-ai-agent/frontend/panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          # Valor dummy: alcanza para validar que el build no rompe. El valor
          # real se carga como variable del servicio en Railway (ver DEPLOY.md).
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build

  landing:
    name: Landing (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-ai-agent/frontend/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-ai-agent/frontend/landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_WHATSAPP_SALES_NUMBER: "56900000000"
          NEXT_PUBLIC_PANEL_URL: https://panel.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build
