spring.application.name=whatsapp-ai-agent

# Postgres local (ver docker-compose.yml). Sin secretos hardcodeados:
# los valores reales vienen de variables de entorno (.env local, o env vars
# del hosting en producción). Los valores tras ":" son defaults solo para
# desarrollo local con el docker-compose incluido.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whatsapp_ai_agent}
spring.datasource.username=${DB_USERNAME:whatsapp}
spring.datasource.password=${DB_PASSWORD:whatsapp}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Twilio (sandbox WhatsApp) - sin defaults: si faltan, deben fallar explícito,
# no correr silenciosamente sin credenciales. Setear vía variables de entorno.
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER}
