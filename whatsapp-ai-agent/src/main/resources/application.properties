spring.application.name=whatsapp-ai-agent

# Postgres local (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_ai_agent
spring.datasource.username=whatsapp
spring.datasource.password=whatsapp
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Twilio (sandbox WhatsApp) - completar en Semana 1
twilio.account-sid=
twilio.auth-token=
twilio.whatsapp-number=
