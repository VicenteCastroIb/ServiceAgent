# Perfil temporal mientras Docker/Postgres no está disponible en esta máquina.
# Actívalo con "Active profiles: local" en la Run Configuration de IntelliJ.
# NO usar en producción - datos en memoria, se pierden al reiniciar.
spring.datasource.url=jdbc:h2:mem:whatsapp_ai_agent;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
