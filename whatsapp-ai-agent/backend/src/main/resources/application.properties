spring.application.name=whatsapp-ai-agent

# Sin secretos hardcodeados: los valores reales vienen de variables de entorno
# (.env local, o env vars del hosting en producción). Default temporal: H2 en
# memoria, mientras Docker/Postgres no esté disponible en esta máquina.
# Cuando Docker funcione, setear DB_URL/DB_USERNAME/DB_PASSWORD en el .env
# apuntando a jdbc:postgresql://localhost:5432/whatsapp_ai_agent y listo -
# Spring Boot detecta el driver automáticamente según la URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:whatsapp_ai_agent;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
# Respeta X-Forwarded-* (necesario detrás de ngrok/Railway/Render para que
# la validación de firma de Twilio compare contra la URL pública real).
server.forward-headers-strategy=framework

# Healthcheck de Railway/Render (ver Dockerfile/railway.json y SecurityConfig,
# que lo deja público). Solo se expone "health", nada más del resto de
# Actuator (env, beans, etc. quedarían con info sensible si se expusieran).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El indicador de salud de mail intenta conectarse al SMTP en cada healthcheck.
# MAIL_SMTP_HOST es opcional (ver OwnerNotificationService) y normalmente no
# está seteado en producción todavía, lo que tumbaba el healthcheck entero
# (DOWN) aunque la app y la DB estuvieran perfectamente sanas. Se desactiva:
# el envío de mail sigue siendo best-effort y no debe afectar la salud del servicio.
management.health.mail.enabled=false

# Twilio (sandbox WhatsApp) - sin defaults: si faltan, deben fallar explícito,
# no correr silenciosamente sin credenciales. Setear vía variables de entorno.
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER}

# Anthropic (Claude Haiku 4.5, ver doc secciones 5.1 y 6) - sin default, fail-fast.
anthropic.api-key=${ANTHROPIC_API_KEY}

# JWT para el panel (Next.js, otro origen/puerto - ver SecurityConfig).
# jwt.secret debe ser una clave base64 de al menos 256 bits (32 bytes).
# Generarla con: openssl rand -base64 32
# Sin default: si falta, debe fallar explícito, no correr con una clave débil.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# SameSite de la cookie de sesión del panel (ver AuthController). Default
# "None" porque panel y backend hoy corren en subdominios *.up.railway.app
# distintos (cross-site para cookies) - cambiar a "Lax" (COOKIE_SAME_SITE=Lax)
# cuando panel y backend queden bajo el mismo dominio raíz (ver DEPLOY.md,
# sección 5): más estricto y funciona en todos los navegadores sin depender
# de que acepten cookies cross-site de terceros.
app.security.cookie-same-site=${COOKIE_SAME_SITE:None}

# Cifra en reposo las credenciales de terceros que carga cada tenant (Flow,
# WooCommerce, Instagram - ver Tenant/EncryptedStringConverter). Debe
# decodificar a exactamente 32 bytes (AES-256). Sin default: si falta, la app
# no arranca - guardar esas credenciales sin cifrar no es aceptable.
# Generarla con: openssl rand -base64 32 (NO reusar jwt.secret - son claves
# para propósitos distintos).
app.encryption-key=${APP_ENCRYPTION_KEY}

# Recordatorios automáticos de citas (plan Pro, ver doc secciones 3 y 6, y ReminderJob).
reminders.intervalo-ms=${REMINDERS_INTERVALO_MS:300000}
reminders.anticipacion-minutos=${REMINDERS_ANTICIPACION_MINUTOS:60}

# Plantilla "utility" de WhatsApp para los recordatorios (Twilio Content API -
# ver TwilioTemplateService/WhatsappTemplateController). Sin default y sin
# fail-fast a propósito: mientras no esté cargado, ReminderJob sigue mandando
# texto libre (válido en el sandbox de Twilio, no en producción con WABA
# verificado - doc sección 6). Se carga acá una vez que la plantilla creada
# por POST /admin/whatsapp-templates queda "approved".
reminders.content-sid=${REMINDERS_CONTENT_SID:}
reminders.content-language=${REMINDERS_CONTENT_LANGUAGE:es}

# Login del panel (Next.js) - único usuario por ahora, sin default, fail-fast.
# Ver SecurityConfig: reemplaza al usuario "user" con password aleatoria que
# generaba Spring Boot antes de que este proyecto tuviera su propio login.
panel.username=${PANEL_USERNAME}
panel.password=${PANEL_PASSWORD}

# Origen(es) permitidos por CORS para llamar a la API desde el navegador (ver
# SecurityConfig). Lista separada por comas si hace falta más de uno (ej.
# preview + producción). Default: solo localhost:3000 (desarrollo local).
panel.allowed-origins=${PANEL_ALLOWED_ORIGINS:http://localhost:3000}

# Plan Catálogo/Ecommerce (doc secciones 3, 5.1 y 5.3, ver PaymentService).
# Base de la API de Flow: sandbox por defecto para no arriesgar cobrar plata
# real mientras se prueba - cambiar a https://www.flow.cl/api en producción.
flow.api-base-url=${FLOW_API_BASE_URL:https://sandbox.flow.cl/api}

# URL pública donde corre este backend (la usa PaymentService para armar
# urlConfirmation/urlReturn al llamar a Flow). En local hace falta un túnel
# tipo ngrok, igual que con el webhook de Twilio, para que Flow pueda
# llamarla de vuelta.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Suscripción SaaS: cobro automático mensual de cada TENANT hacia NOSOTROS
# (doc secciones 3 y 6, ver SubscriptionBillingService). Es la cuenta Flow
# PROPIA de la plataforma - nada que ver con flow.api-base-url de arriba,
# que ahí se refiere a la cuenta de cada tenant para venderle a SUS clientes.
# Sin default y sin fail-fast a propósito: a diferencia de Twilio/Anthropic,
# esto es opcional al arrancar - Vicente todavía no tiene su propia cuenta
# Flow (recién la va a necesitar antes del 3er cliente, doc sección 10).
# Mientras no estén cargadas, SubscriptionBillingService rechaza sus
# operaciones con un mensaje claro en vez de romper el arranque.
flow.billing.api-key=${FLOW_BILLING_API_KEY:}
flow.billing.secret-key=${FLOW_BILLING_SECRET_KEY:}

# Canal Instagram (doc secciones 3 y 5.1, ver InstagramWebhookController /
# InstagramMessagingService) - Graph API directa de Meta, sin pasar por
# Twilio. meta.app-secret firma los webhooks entrantes (X-Hub-Signature-256,
# compartido por todos los tenants: es el secreto de la Meta App, no de cada
# negocio); meta.webhook-verify-token es el string que se configura una vez
# en el Meta App Dashboard al dar de alta el webhook. Sin default y sin
# fail-fast a propósito, mismo criterio que flow.billing.* arriba: Vicente
# todavía no tiene la Meta App creada. Mientras no estén cargados, el
# controller rechaza los webhooks con 503 en vez de romper el arranque.
meta.app-secret=${META_APP_SECRET:}
meta.webhook-verify-token=${META_WEBHOOK_VERIFY_TOKEN:}

# Conexión SELF-SERVICE de Instagram por OAuth (doc sección 12, ver
# InstagramOAuthService) - el dueño del negocio conecta su propia cuenta
# desde el panel, sin que el admin cargue nada a mano. Credenciales de la
# Instagram API con Instagram Login (App Dashboard > Instagram > API setup
# with Instagram login > Business login settings) - DISTINTAS de
# meta.app-secret de arriba, que es para firmar los webhooks entrantes.
# Sin default y sin fail-fast a propósito, mismo criterio que meta.*: mientras
# no estén cargadas, InstagramOAuthService.generarUrlAutorizacion rechaza el
# intento con un mensaje claro en vez de romper el arranque.
instagram.oauth.app-id=${INSTAGRAM_APP_ID:}
instagram.oauth.app-secret=${INSTAGRAM_APP_SECRET:}

# Instagram Graph API (Business Login for Instagram - ver InstagramMessagingService).
instagram.graph-api-base-url=${INSTAGRAM_GRAPH_API_BASE_URL:https://graph.instagram.com/v21.0}
instagram.refresh-intervalo-ms=${INSTAGRAM_REFRESH_INTERVALO_MS:86400000}
instagram.refresh-anticipacion-dias=${INSTAGRAM_REFRESH_ANTICIPACION_DIAS:10}

# Notificación al dueño del negocio cuando una conversación se deriva a
# humano (doc sección 4: "se notifica al dueño"). Email simple por SMTP -
# ver OwnerNotificationService. Sin default y sin fail-fast a propósito,
# mismo criterio que flow.billing.*/meta.* arriba: Vicente todavía no tiene
# un proveedor SMTP elegido. Mientras spring.mail.host esté vacío,
# OwnerNotificationService no intenta enviar nada (spring-boot-starter-mail
# igual se autoconfigura con un JavaMailSender "vacío" - no falla al
# arrancar, solo fallaría si se intentara enviar sin host real).
spring.mail.host=${MAIL_SMTP_HOST:}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
notifications.email.from=${MAIL_FROM_ADDRESS:}

# URL pública del panel (Next.js). Usada para: 1) incluir un link directo en
# el email de notificación de handoff, y 2) redirigir al dueño de vuelta al
# login del panel después de registrar su tarjeta en Flow (ver
# FlowBillingWebhookController - doc sección 12). Opcional, pero sin esto el
# flujo de registro self-service deja al dueño viendo una respuesta cruda de
# la API en vez de mandarlo al panel - conviene cargarla siempre que se pueda.
panel.public-url=${PANEL_PUBLIC_URL:}

# Email del ADMIN de la plataforma (vos, Vicente - no confundir con
# notifications.email.from, que es el remitente). Ver
# OwnerNotificationService.notificarNuevoTenantActivo: se usa para avisarte
# cuando un tenant self-service (RegistroController, doc sección 12) confirma
# su primer pago, para que vayas a aprovisionarle el WhatsApp/Instagram desde
# el panel admin. Opcional - si no se carga, solo queda el log del backend.
platform.admin-email=${PLATFORM_ADMIN_EMAIL:}
